<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="themeToggle">🌙</button>

<div class="app-container">

    <div class="history">
        <h3>History</h3>
        <button id="clearHistory">
    Clear History
</button>

        <ul id="historyList"></ul>
    </div>

    <div class="calculator">
        <div class="display">
            <input type="text" id="screen" readonly>
        </div>

        <div class="buttons">

            <button class="btn special" onclick="clearScreen()">C</button>
            <button class="btn special" onclick="deleteLast()">⌫</button>
            <button class="btn operator" onclick="append('/')">÷</button>
            <button class="btn operator" onclick="append('*')">×</button>

            <button class="btn" onclick="append('7')">7</button>
            <button class="btn" onclick="append('8')">8</button>
            <button class="btn" onclick="append('9')">9</button>
            <button class="btn operator" onclick="append('-')">−</button>

            <button class="btn" onclick="append('4')">4</button>
            <button class="btn" onclick="append('5')">5</button>
            <button class="btn" onclick="append('6')">6</button>
            <button class="btn operator" onclick="append('+')">+</button>

            <button class="btn" onclick="append('1')">1</button>
            <button class="btn" onclick="append('2')">2</button>
            <button class="btn" onclick="append('3')">3</button>
            <button class="btn equal" onclick="calculate()">=</button>

            <button class="btn zero" onclick="append('0')">0</button>
            <button class="btn" onclick="append('.')">.</button>

        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
