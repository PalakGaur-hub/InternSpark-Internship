<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>

    <link rel="stylesheet" href="style.css">

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            <i class="fa-brands fa-spotify"></i>
        </div>

        <div class="menu">

            <div class="menu-item">
                <i class="fa-solid fa-house"></i>
            </div>

            <div class="menu-item">
                <i class="fa-solid fa-magnifying-glass"></i>
            </div>

            <div class="menu-item">
                <i class="fa-solid fa-book"></i>
            </div>

            <div class="menu-item">
                <i class="fa-solid fa-plus"></i>
            </div>

        </div>

        <div class="playlist-images">

            <img src="assets/images/daily mix 1.png">
<img src="assets/images/daily mix 2.png">
<img src="assets/images/daily mix 3.png">
<img src="assets/images/daily mix 4.png">
<img src="assets/images/daily mix 5.png">

        </div>

    </aside>

    <!-- MAIN CONTENT -->

    <main class="main-content">

        <div class="top-bar">

            <button>All</button>
            <button>Music</button>
            <button>Podcasts</button>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                    type="text"
                    placeholder="What do you want to play?">
            </div>

        </div>

        <section class="recent-section">

            <div class="recent-card">
                <img src="https://picsum.photos/80?11">
                <span>Liked Songs</span>
            </div>

            <div class="recent-card">
                <img src="https://picsum.photos/80?12">
                <span>Happy Vibes</span>
            </div>

            <div class="recent-card">
                <img src="https://picsum.photos/80?13">
                <span>Trending India</span>
            </div>

            <div class="recent-card">
                <img src="https://picsum.photos/80?14">
                <span>Daily Mix</span>
            </div>

        </section>

        <section class="playlist-section">

            <h2>Made For Palak</h2>

            <div class="playlist-grid">

                <div class="playlist-card">
                    <img src="https://picsum.photos/200?21">
                    <h4>Daily Mix 01</h4>
                    <p>Your favourite songs</p>
                </div>

                <div class="playlist-card">
                    <img src="https://picsum.photos/200?22">
                    <h4>Daily Mix 02</h4>
                    <p>Recommended for you</p>
                </div>

                <div class="playlist-card">
                    <img src="https://picsum.photos/200?23">
                    <h4>Daily Mix 03</h4>
                    <p>Fresh music</p>
                </div>

                <div class="playlist-card">
                    <img src="https://picsum.photos/200?24">
                    <h4>Daily Mix 04</h4>
                    <p>Popular tracks</p>
                </div>

                <div class="playlist-card">
                    <img src="https://picsum.photos/200?25">
                    <h4>Daily Mix 05</h4>
                    <p>Top artists</p>
                </div>

            </div>

        </section>

    </main>

    <!-- RIGHT PANEL -->

    <aside class="right-panel">

        <img
        class="album-cover"
src="assets/images/right panel.png"

        <h2>Bairan</h2>

        <p>Banjaare</p>

        <button class="follow-btn">
            Follow
        </button>

    </aside>

</div>

<!-- PLAYER -->

<footer class="player">

    <div class="song-info">

        <img
        src="assets/images/bottom player.png">

        <div>
            <h4>Bairan</h4>
            <p>Banjaare</p>
        </div>

    </div>

    <div class="player-controls">

        <i class="fa-solid fa-backward"></i>

        <i class="fa-solid fa-circle-play play-btn"></i>

        <i class="fa-solid fa-forward"></i>

        <input
        type="range"
        min="0"
        max="100">

    </div>

</footer>

<script src="script.js"></script>

</body>
</html>
